function addToCart(id){const p=state.products.find(x=>x.id===id);if(!p)return;const item=cart.find(x=>x.id===id);if(item)item.qty++;else cart.push({id,qty:1});updateCartCount();toast(p.name+' added to cart')}
function updateCartCount(){const n=cart.reduce((a,b)=>a+b.qty,0);const e=document.getElementById('cartCount');if(e)e.textContent=n;const n2=document.getElementById('navCart');if(n2)n2.textContent=n}
function openCart(){const items=cart.map(i=>{const p=state.products.find(x=>x.id===i.id);return `<div class="cart-item"><div><b>${p.name}</b><div>${money(p.price)} × ${i.qty}</div></div><div class="quantity"><button onclick="changeQty(${p.id},-1)">−</button> ${i.qty} <button onclick="changeQty(${p.id},1)">+</button></div></div>`}).join('')||'<div class="empty">Your cart is empty.</div>';const total=cart.reduce((s,i)=>s+state.products.find(p=>p.id===i.id).price*i.qty,0);showModal(`<div class="modalbox"><div class="modalhead"><h2 class="serif">Your Royal Order</h2><button class="x" onclick="closeModal()">×</button></div>${items}<hr><h3 style="text-align:right">Total: ${money(total)}</h3><div class="formgrid"><div class="field"><label>Name</label><input id="custName" placeholder="Customer name"></div><div class="field"><label>Mobile</label><input id="custPhone" placeholder="Mobile number"></div><div class="field full"><label>Delivery Address</label><textarea id="custAddress" placeholder="Complete delivery address"></textarea></div></div><div style="text-align:right;margin-top:16px"><button class="btn btn-wine" onclick="placeOrder()">Place Order</button></div></div>`)}
function changeQty(id,d){const i=cart.find(x=>x.id===id);if(!i)return;i.qty+=d;if(i.qty<=0)cart=cart.filter(x=>x.id!==id);updateCartCount();openCart()}
function placeOrder(){if(!cart.length)return;const name=document.getElementById('custName').value.trim();const phone=document.getElementById('custPhone').value.trim();const address=document.getElementById('custAddress').value.trim();if(!name||!phone||!address){toast('Please enter name, mobile and address');return}const items=cart.map(i=>{const p=state.products.find(x=>x.id===i.id);return {id:p.id,name:p.name,qty:i.qty,price:p.price}});const total=items.reduce((s,i)=>s+i.qty*i.price,0);const order={id:'MK-'+Date.now().toString().slice(-8),date:new Date().toLocaleString('en-IN'),customer:name,phone,address,items,total,status:'Received',paymentStatus:'Pending',paid:0};state.orders.unshift(order);state.customers=state.customers||[];const existing=state.customers.find(c=>c.phone===phone);if(existing){existing.orders=(existing.orders||0)+1;existing.spent=(existing.spent||0)+total;existing.lastOrder=order.date}else state.customers.push({name,phone,orders:1,spent:total,lastOrder:order.date});save();cart=[];updateCartCount();closeModal();toast('Order '+order.id+' received successfully')}

function showModal(html) {
  let modal = document.getElementById('modal');

  // Re-create the modal if the admin view removed it
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'modal';
    modal.className = 'modal';
    document.body.appendChild(modal);
  }

  modal.innerHTML = html;
  modal.classList.add('show');
}

function closeModal() {
  const modal = document.getElementById('modal');

  if (modal) {
    modal.classList.remove('show');
    modal.innerHTML = '';
  }
}

function compressImage(file,maxW=1200,quality=.82){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,maxW/img.width);const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function loadPhoto(e){const f=e.target.files[0];if(!f)return;try{const data=await compressImage(f);document.getElementById('pPhoto').value=data;document.getElementById('pPreview').src=data;toast('Food photograph loaded. Click Save Dish.')}catch(err){toast('Could not read that image')}}

function deleteExpense(i){if(confirm('Delete this expense?')){state.expenses.splice(i,1);save();renderAdmin()}}
function customersHTML(){const map={};state.orders.forEach(o=>{map[o.phone]=map[o.phone]||{name:o.customer,phone:o.phone,orders:0,spent:0,last:o.date};map[o.phone].orders++;map[o.phone].spent+=o.total;map[o.phone].last=o.date});const cs=Object.values(map);return `<div class="toolbar"><div><h1 class="serif" style="color:var(--wine);margin:0">Customers</h1><p style="color:var(--muted)">Customer history is derived from website orders.</p></div></div><div class="admin-panel"><table class="admin-table"><thead><tr><th>Customer</th><th>Mobile</th><th>Orders</th><th>Total Spent</th><th>Last Order</th></tr></thead><tbody>${cs.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone)}</td><td>${x.orders}</td><td>${money(x.spent)}</td><td>${x.last}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No customers yet.</td></tr>'}</tbody></table></div>`}
function reportsHTML(){const sales=state.orders.reduce((s,o)=>s+o.total,0),exp=state.expenses.reduce((s,e)=>s+Number(e.amount||0),0),orders=state.orders.length,avg=orders?sales/orders:0;const productSales={};state.orders.forEach(o=>o.items.forEach(i=>productSales[i.name]=(productSales[i.name]||0)+i.qty));const top=Object.entries(productSales).sort((a,b)=>b[1]-a[1]).slice(0,10);return `<div class="toolbar"><div><h1 class="serif" style="color:var(--wine);margin:0">Reports</h1><p style="color:var(--muted)">Simple business intelligence for Madhura Kitchen.</p></div><button class="btn btn-light" onclick="downloadBackup()">Export Backup</button></div><div class="stats"><div class="stat"><small>Total Sales</small><b>${money(sales)}</b></div><div class="stat"><small>Expenses</small><b>${money(exp)}</b></div><div class="stat"><small>Estimated Profit</small><b>${money(sales-exp)}</b></div><div class="stat"><small>Average Order</small><b>${money(avg)}</b></div></div><div class="admin-panel"><h2 class="serif">Top Selling Dishes</h2>${top.map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee"><span>${i+1}. ${esc(x[0])}</span><b>${x[1]} portions</b></div>`).join('')||'<div class="empty">No sales data yet.</div>'}</div><div class="admin-panel"><h2 class="serif">Expense Breakdown</h2>${Object.entries(state.expenses.reduce((m,e)=>(m[e.category]=(m[e.category]||0)+Number(e.amount||0),m),{})).map(x=>`<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee"><span>${esc(x[0])}</span><b>${money(x[1])}</b></div>`).join('')||'<div class="empty">No expenses yet.</div>'}</div>`}
function purchasesHTML(){return `<div class="toolbar"><div><h1 class="serif" style="color:var(--wine);margin:0">Purchases</h1><p style="color:var(--muted)">Record supplier purchases and outstanding bills.</p></div><button class="btn btn-wine" onclick="openPurchaseForm()">+ Add Purchase</button></div><div class="admin-panel"><table class="admin-table"><thead><tr><th>Date</th><th>Supplier</th><th>Item</th><th>Qty</th><th>Total</th><th>Paid</th><th>Balance</th></tr></thead><tbody>${state.purchases.map(x=>`<tr><td>${x.date}</td><td>${esc(x.supplier)}</td><td>${esc(x.item)}</td><td>${x.qty} ${x.unit}</td><td>${money(x.total)}</td><td>${money(x.paid)}</td><td>${money(x.total-x.paid)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No purchases yet.</td></tr>'}</tbody></table></div>`}
function openPurchaseForm(){const opts=state.suppliers.map(x=>`<option>${esc(x.name)}</option>`).join('');showModal(`<div class="modalbox"><div class="modalhead"><h2 class="serif">Add Purchase</h2><button class="x" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field"><label>Date</label><input id="pDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Supplier</label><input id="pSupplier" list="supplierList"><datalist id="supplierList">${opts}</datalist></div><div class="field"><label>Item</label><input id="pItem"></div><div class="field"><label>Quantity</label><input id="pQty" type="number"></div><div class="field"><label>Unit</label><input id="pUnit" value="kg"></div><div class="field"><label>Total</label><input id="pTotal" type="number"></div><div class="field"><label>Paid</label><input id="pPaid" type="number"></div></div><div style="margin-top:18px;text-align:right"><button class="btn btn-wine" onclick="savePurchase()">Save Purchase</button></div></div>`)}
function savePurchase(){const x={date:document.getElementById('pDate').value,supplier:document.getElementById('pSupplier').value,item:document.getElementById('pItem').value.trim(),qty:Number(document.getElementById('pQty').value)||0,unit:document.getElementById('pUnit').value.trim(),total:Number(document.getElementById('pTotal').value)||0,paid:Number(document.getElementById('pPaid').value)||0};if(!x.item||!x.total)return toast('Item and total required');state.purchases.unshift(x);if(x.supplier){const s=state.suppliers.find(s=>s.name===x.supplier);if(s)s.payable=(s.payable||0)+(x.total-x.paid)}save();closeModal();renderAdmin();toast('Purchase saved')}
function settingsHTML(){return `<div class="toolbar"><div><h1 class="serif" style="color:var(--wine);margin:0">Settings & Backup</h1><p style="color:var(--muted)">Operational settings, backups and GitHub publishing.</p></div></div><div class="admin-panel"><div class="formgrid"><div class="field"><label>Delivery Charge (₹)</label><input id="setDelivery" type="number" value="${state.settings.deliveryCharge}"></div><div class="field"><label>Minimum Order (₹)</label><input id="setMin" type="number" value="${state.settings.minOrder}"></div></div><div style="margin-top:18px"><button class="btn btn-wine" onclick="saveSettings()">Save Settings</button> <button class="btn btn-light" onclick="downloadBackup()">Download Full Backup</button> <button class="btn btn-light" onclick="document.getElementById('restoreFile').click()">Restore Backup</button><input id="restoreFile" type="file" accept="application/json" style="display:none" onchange="restoreBackup(event)"></div></div><div class="admin-panel"><h2 class="serif">GitHub Publishing</h2><p style="color:var(--muted);line-height:1.7">Edit everything from this dashboard. When ready to publish, download <b>default-state.json</b> and replace <code>data/default-state.json</code> in your GitHub repository, then commit the change.</p><div class="notice"><b>Important:</b> GitHub Pages is static. The dashboard cannot securely write directly to GitHub. This export is the safe workflow for the static version.</div><div style="margin-top:16px"><button class="btn btn-wine" onclick="exportGitHubState()">⬇️ Download GitHub default-state.json</button> <button class="btn btn-light" onclick="exportMenuOnly()">⬇️ Download menu.json</button> <button class="btn btn-light" onclick="exportBusinessOnly()">⬇️ Download business.json</button></div></div><div class="admin-panel"><div class="notice"><b>Production security:</b> this downloadable prototype stores data in this browser only. Do not use it as the production database. For public launch, authentication, orders, customer records and payments must be moved to a secure server with HTTPS, hashed passwords, role-based access, server-side validation, database backups and audit logs.</div></div>`}
function saveSettings(){state.settings.deliveryCharge=Number(document.getElementById('setDelivery').value)||0;state.settings.minOrder=Number(document.getElementById('setMin').value)||0;save();toast('Settings saved')}
function restoreBackup(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data.business||!data.products)throw Error();state=data;save();renderAdmin();toast('Backup restored')}catch(err){toast('Invalid Madhura Kitchen backup')}};r.readAsText(f)}
function businessHTML(){return `<div class="toolbar"><div><h1 class="serif" style="color:var(--wine);margin:0">Business Profile</h1><p style="color:var(--muted)">Edit your hotel identity, contact details, logo and owner photograph here.</p></div></div><div class="admin-panel"><div class="formgrid"><div class="field"><label>Business Name</label><input id="bName" value="${esc(state.business.name)}"></div><div class="field"><label>Owner Name</label><input id="bOwner" value="${esc(state.business.ownerName)}"></div><div class="field full"><label>One-line Marathi Food Tagline</label><input id="bTag" value="${esc(state.business.tagline)}"></div><div class="field full"><label>Hotel / Kitchen Address</label><textarea id="bAddress">${esc(state.business.address)}</textarea></div><div class="field"><label>Contact Phone</label><input id="bPhone" value="${esc(state.business.phone)}"></div><div class="field"><label>WhatsApp</label><input id="bWhats" value="${esc(state.business.whatsapp)}"></div><div class="field"><label>Email</label><input id="bEmail" value="${esc(state.business.email)}"></div><div class="field"><label>Opening Hours</label><input id="bHours" value="${esc(state.business.hours)}"></div><div class="field full"><label>Round Business Logo</label><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><img id="bLogoPreview" src="${esc(state.business.logo)}" style="width:100px;height:100px;object-fit:cover;border-radius:50%;border:3px solid var(--gold);background:#eee"><div style="flex:1;min-width:250px"><input id="bLogo" value="${esc(state.business.logo)}" oninput="previewBusinessPhoto('bLogo','bLogoPreview')"><input id="bLogoFile" type="file" accept="image/jpeg,image/png,image/webp" onchange="loadBusinessPhoto(event,'bLogo','bLogoPreview')" style="margin-top:8px"><small style="display:block;color:#7a6857;margin-top:6px">Upload your logo or paste an image URL.</small></div></div></div><div class="field full"><label>Owner Photograph</label><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><img id="bOwnerPreview" src="${esc(state.business.ownerPhoto)}" style="width:100px;height:120px;object-fit:cover;border-radius:16px;border:2px solid #dfc58f;background:#eee"><div style="flex:1;min-width:250px"><input id="bOwnerPhoto" value="${esc(state.business.ownerPhoto)}" oninput="previewBusinessPhoto('bOwnerPhoto','bOwnerPreview')"><input id="bOwnerFile" type="file" accept="image/jpeg,image/png,image/webp" onchange="loadBusinessPhoto(event,'bOwnerPhoto','bOwnerPreview')" style="margin-top:8px"><small style="display:block;color:#7a6857;margin-top:6px">Upload a new owner photograph; it will appear in the Story section.</small></div></div></div></div><div style="margin-top:18px;text-align:right"><button class="btn btn-wine" onclick="saveBusiness()">Save Business Profile</button></div></div><div class="admin-panel"><div class="notice"><b>Tip:</b> After saving, the public website immediately uses the new name, logo, owner photo, address, phone, WhatsApp, email, opening hours and Marathi tagline.</div></div><div class="admin-panel"><div class="notice"><b>Security note:</b> This is a front-end prototype using browser storage. Before public launch, move authentication, customer data, orders and payments to a secure server/database with HTTPS, hashed passwords, access control and backups.</div></div>`}
async function loadBusinessPhoto(e,target,previewId){const f=e.target.files[0];if(!f)return;try{const data=await compressImage(f,1200,.82);document.getElementById(target).value=data;if(previewId)document.getElementById(previewId).src=data;toast('Image loaded. Click Save Business Profile.')}catch(err){toast('Could not read that image')}}
function previewBusinessPhoto(target,previewId){const url=document.getElementById(target).value.trim();if(url)document.getElementById(previewId).src=url}
function saveBusiness(){state.business={...state.business,name:document.getElementById('bName').value.trim(),ownerName:document.getElementById('bOwner').value.trim(),tagline:document.getElementById('bTag').value.trim(),address:document.getElementById('bAddress').value.trim(),phone:document.getElementById('bPhone').value.trim(),whatsapp:document.getElementById('bWhats').value.trim(),email:document.getElementById('bEmail').value.trim(),hours:document.getElementById('bHours').value.trim(),logo:document.getElementById('bLogo').value.trim(),ownerPhoto:document.getElementById('bOwnerPhoto').value.trim()};save();renderAdmin();toast('Business profile updated')}
function downloadBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='madhura-kitchen-backup.json';a.click();URL.revokeObjectURL(a.href)}
function downloadJson(filename,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function exportGitHubState(){save();downloadJson('default-state.json',state);toast('GitHub state downloaded. Replace data/default-state.json in your repository.')}
function exportMenuOnly(){save();downloadJson('menu.json',state.products);toast('menu.json downloaded')}
function exportBusinessOnly(){save();downloadJson('business.json',state.business);toast('business.json downloaded')}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
async function boot(){const cached=localStorage.getItem('mkRoyalState');if(!cached){try{const r=await fetch('data/default-state.json',{cache:'no-store'});if(r.ok){const remote=await r.json();if(remote&&remote.products&&remote.business)state=remote;}}catch(e){}}renderSite()}
boot();
</script>
</body>
</html>
